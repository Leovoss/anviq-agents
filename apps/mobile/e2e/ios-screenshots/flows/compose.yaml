appId: com.anviq.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ANVIQ_ACTIVE_EMAIL: ${ANVIQ_SCREENSHOT_EMAIL}
- openLink: "anviq:///new"
- extendedWaitUntil:
    visible: "Name this bot"
    timeout: 15000
- takeScreenshot: 01-new-bot
- tapOn: "Cancel"
- openLink: "anviq:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "anviq:///new-group"
- extendedWaitUntil:
    visible: "Name this group"
    timeout: 15000
- takeScreenshot: 03-new-group
- openLink: "anviq:///"
